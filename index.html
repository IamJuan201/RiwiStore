<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwi Store</title>

  <!-- Estilos propios (sin Tailwind) -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-body">

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-logo">Riwi Store</h1>
    </div>
  </header>

  <!-- BUSCADOR -->
  <section class="search-section">
    <div class="container">
      <div class="search-wrapper">
        <form class="search-form" id="frm-search">
          <input
            type="text"
            placeholder="Buscar producto..."
            class="search-input"
          />
          <button type="submit" class="search-btn">Buscar</button>
        </form>
      </div>
    </div>
  </section>

  <!-- RESULTADOS -->
  <section class="results-section">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Resultados</h2>
        <span class="results-count">
          <span id="quantity">0</span> productos encontrados
        </span>
      </div>

      <div class="grid-results" id="search-results"></div>
    </div>
  </section>

  <!-- CARTELERA -->
  <section class="catalog-section" id="catalog-section">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title" id="catalog-title">Productos</h2>
        <button class="view-all-btn">Ver todo</button>
      </div>

      <div class="grid-catalog" id="Catalog"></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>

</html>
