<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwi Store</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-white min-h-screen">

    <!-- HEADER -->
    <header class="border-b border-zinc-800 bg-zinc-900">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold">
                 Riwi Store
            </h1>
        </div>
    </header>

    <!-- BUSCADOR -->
    <section class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex gap-4">
            <form class="flex gap-4 w-full" id="frm-search">
                <input type="text" placeholder="Buscar producto..."
                    class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:border-red-500" />

                <button type="submit" class="bg-red-600 hover:bg-red-500 px-6 rounded-xl">
                    Buscar
                </button>
            </form>
        </div>
    </section>

    <!-- RESULTADOS -->
    <section class="max-w-7xl mx-auto px-6 pb-12">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">
                Resultados
            </h2>

            <span class="text-sm text-zinc-400">
                <span id="quantity">0</span> productos encontrados
            </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="search-results">
            

        </div>
    </section>

    <!-- CARTELERA -->
    <section class="max-w-7xl mx-auto px-6 pb-12">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">
                Productos
            </h2>

            <button class="text-sm text-zinc-400 hover:text-white">
                Ver todo
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6" id="Catalog">


        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
